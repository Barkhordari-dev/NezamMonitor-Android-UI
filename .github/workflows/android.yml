name: Android CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - run: chmod +x gradlew
      # v3.11.7: signed release — the release keystore itself is NEVER
      # committed (see app/build.gradle.kts). It arrives as the
      # RELEASE_KEYSTORE_BASE64 Actions secret (base64 of
      # nezam-release.keystore) and is decoded here into release.keystore
      # at the repo root, which build.gradle.kts already picks up with
      # alias nezamrelease / password nezam1234. When the secret is
      # absent the build falls back to unsigned, exactly as before.
      - name: Restore release keystore
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: printf '%s' "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
      - name: Build AAB
        run: ./gradlew bundleRelease --stacktrace --no-daemon
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
